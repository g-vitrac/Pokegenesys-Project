services:
    php:
      build:
        context: .
        dockerfile: .docker/Dockerfile
      volumes:
        - "./sf:/var/www/html/sf"
      ports:
        - "80:80"
        - "443:443"

    db:
      image: mariadb
      restart: always
      command:
        - '--collation-server=utf8mb4_unicode_ci'
      ports:
        - "3306:3306"
      environment:
        MARIADB_ROOT_PASSWORD: root